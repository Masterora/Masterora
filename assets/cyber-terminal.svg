<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Der_Orange · Backend / AI</title>
<desc id="desc">A dark terminal with green and cyan typography, animated command typing, subtle scanlines and a geometric circuit pattern.</desc>
<defs>
 <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1h4" stroke="#b0ffdc" stroke-opacity=".035"/></pattern>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#58ffb0" stroke-opacity=".06"/></pattern>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5affb8" stop-opacity="0"/><stop offset="1" stop-color="#5affb8" stop-opacity=".065"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#61ffae"/><stop offset=".7" stop-color="#35d9ec"/><stop offset="1" stop-color="#d46ca9"/></linearGradient>
 <clipPath id="frame"><path d="M16 1H977L999 23V374L983 389H1V16Z"/></clipPath>
 <clipPath id="command"><rect class="reveal" x="201" y="68" width="116" height="35"/></clipPath>
 <clipPath id="slice"><rect x="40" y="155" width="660" height="15"/></clipPath>
</defs>
<style>
 .reveal{transform-origin:201px 0;animation:typing 10s steps(6,end) infinite}
 .cursor{animation:cursor 10s steps(6,end) infinite}.blink{animation:blink 1.2s steps(1,end) infinite}
 .answer{animation:answer 10s linear infinite}.glitch{animation:glitch 12s steps(1,end) infinite}
 .sweep{animation:sweep 9s linear infinite}.packet{stroke-dasharray:20 500;animation:packet 12s linear infinite}.packet2{animation-delay:-6s}
 @keyframes typing{0%,8%{transform:scaleX(0)}24%,96%{transform:scaleX(1)}100%{transform:scaleX(0)}}
 @keyframes cursor{0%,8%{transform:translateX(0)}24%,96%{transform:translateX(116px)}100%{transform:translateX(0)}}
 @keyframes blink{50%{opacity:0}}
 @keyframes answer{0%,24%{opacity:0}27%,96%{opacity:1}100%{opacity:0}}
 @keyframes glitch{0%,44%,47%,100%{transform:translateX(0);opacity:0}45%{transform:translateX(4px);opacity:.7}46%{transform:translateX(-3px);opacity:.4}}
 @keyframes sweep{from{transform:translateY(-80px)}to{transform:translateY(450px)}}
 @keyframes packet{to{stroke-dashoffset:-1040}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.glitch,.sweep{display:none}.cursor{transform:translateX(116px)}}
</style>
<g clip-path="url(#frame)">
 <path d="M0 0H1000V390H0Z" fill="#080e12"/>
 <rect x="696" y="44" width="304" height="346" fill="url(#grid)"/>
 <path d="M0 44H1000" stroke="#24372f"/>
 <path d="M0 0H1000" stroke="url(#edge)" stroke-width="3"/>
 <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
  <path d="M21 17h9v9h-9Z" fill="#64ffac"/><text x="44" y="28" font-size="14" fill="#8ab9a2">masterora@github: ~</text>
  <text x="973" y="28" text-anchor="end" font-size="12" fill="#7d998d">UTF-8 / zsh</text>
  <text x="40" y="93" font-size="20" fill="#63ffae">orange:~ $</text>
  <g clip-path="url(#command)"><text x="201" y="93" font-size="28" fill="#d9eee3">whoami</text></g>
  <g class="cursor"><path class="blink" d="M204 72v26" stroke="#6dffb4" stroke-width="10"/></g>
  <g class="answer">
   <text x="36" y="184" font-size="64" font-weight="700" letter-spacing="-3" fill="#e4fff0">Der_Orange</text>
   <g clip-path="url(#slice)"><text class="glitch" x="36" y="184" font-size="64" font-weight="700" letter-spacing="-3" fill="#42e8ed">Der_Orange</text></g>
   <text x="40" y="230" font-size="21" fill="#65e3dd">Backend / AI</text>
  </g>
  <text x="40" y="320" font-size="18" fill="#7da18c">~</text><path class="blink" d="M68 304v20" stroke="#65ffae" stroke-width="10"/>
  <text x="40" y="365" font-size="12" letter-spacing="2" fill="#80a490">MASTERORA</text>
 </g>
 <g fill="none" stroke="#214b3b" stroke-width="1.5">
  <path d="M720 100h67l32 32h100v80l-48 48v64h106"/>
  <path d="M738 304v-75l48-48h90v-72h101"/>
  <path d="M720 356h79v-68l49-49h119"/>
  <path d="M776 64v35l44 44v61l-31 31"/>
  <path class="packet" d="M720 100h67l32 32h100v80l-48 48v64h106" stroke="#63ffae"/>
  <path class="packet packet2" d="M738 304v-75l48-48h90v-72h101" stroke="#3ce3ed"/>
 </g>
 <g fill="#0b1913" stroke="#4caf83"><rect x="710" y="90" width="14" height="14"/><rect x="731" y="303" width="14" height="14"/><circle cx="967" cy="239" r="4"/><circle cx="789" cy="235" r="4"/></g>
 <path d="M700 63h-14v266h14" fill="none" stroke="#23392e"/>
 <rect class="sweep" width="1000" height="65" fill="url(#beam)"/>
 <rect width="1000" height="390" fill="url(#scanlines)"/>
</g>
<path d="M16 1H977L999 23V374L983 389H1V16Z" fill="none" stroke="#2b5141"/>
<path d="M1 72V16L16 1H92M907 389h76l16-15v-47" fill="none" stroke="#62ffb0" stroke-width="2"/>
</svg>
