<g transform="translate(245 52)">
  <path d="M0 0h443l17 17v55l-17 17H0L-17 72V17Z" fill="#09110f" fill-opacity=".75" stroke="#244b3b"/>
  <path d="M5 19h420" stroke="#1f3d32" stroke-width="10"/>
  <g class="energy" transform-origin="5px 0"><path d="M5 19h420" stroke="url(#energy)" stroke-width="7"/></g>
  <path class="dash" d="M5 49h420" stroke="#2ddde9" stroke-opacity=".55" stroke-width="2"/>
  <g fill="#5cffae">
    <path class="slot-a" d="M14 66h78v8H14z"/><path class="slot-b" d="M108 66h78v8h-78z"/><path class="slot-c" d="M202 66h78v8h-78z"/>
