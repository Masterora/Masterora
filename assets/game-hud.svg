<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="presentation">
<defs>
  <linearGradient id="energy"><stop stop-color="#61ffb0"/><stop offset=".72" stop-color="#2ddde9"/><stop offset="1" stop-color="#ff4a9e"/></linearGradient>
  <radialGradient id="radar"><stop stop-color="#43ffad" stop-opacity=".18"/><stop offset="1" stop-color="#43ffad" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .radar{transform-origin:124px 96px;animation:spin 6s linear infinite}.reticle{transform-origin:847px 97px;animation:spin 11s linear infinite reverse}
  .energy{animation:energy 4.4s steps(8,end) infinite}.dash{stroke-dasharray:13 18;animation:dash 7s linear infinite}.target{animation:target 2.4s ease-in-out infinite}
  .slot-a{animation:slot 3.2s ease-in-out infinite}.slot-b{animation:slot 3.2s ease-in-out -1.1s infinite}.slot-c{animation:slot 3.2s ease-in-out -2.2s infinite}
  @keyframes spin{to{transform:rotate(360deg)}}@keyframes energy{0%,100%{transform:scaleX(.35)}50%{transform:scaleX(1)}}
  @keyframes dash{to{stroke-dashoffset:-124}}@keyframes target{50%{opacity:.25;transform:scale(.7)}}@keyframes slot{50%{opacity:.25}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.energy{transform:scaleX(.72)}}
</style>
