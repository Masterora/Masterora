<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Der_Orange</title>
<desc id="desc">Abstract cyberpunk terminal with fragmented typography, data noise, scanlines and animated geometry.</desc>
<defs>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1h4" stroke="#b6ffe4" stroke-opacity=".035"/></pattern>
  <pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#53ffad" stroke-opacity=".055"/></pattern>
  <linearGradient id="edge"><stop stop-color="#65ffb3"/><stop offset=".55" stop-color="#2de0ed"/><stop offset="1" stop-color="#ff4aa2"/></linearGradient>
  <linearGradient id="name"><stop stop-color="#ecfff5"/><stop offset=".58" stop-color="#6fffc0"/><stop offset="1" stop-color="#31dce9"/></linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#61ffb2" stop-opacity="0"/><stop offset=".5" stop-color="#61ffb2" stop-opacity=".08"/><stop offset="1" stop-color="#61ffb2" stop-opacity="0"/></linearGradient>
  <clipPath id="frame"><path d="M18 1H973L999 27V279L979 299H1V18Z"/></clipPath>
  <clipPath id="typed"><rect class="type-mask" x="177" y="49" width="112" height="31"/></clipPath>
  <clipPath id="name-slice"><rect x="34" y="151" width="600" height="17"/></clipPath>
</defs>
<style>
  .type-mask{transform-origin:177px 0;animation:type 9s steps(6,end) infinite}
  .type-cursor{animation:type-cursor 9s steps(6,end) infinite}.blink{animation:blink 1.1s steps(1,end) infinite}
  .answer{animation:answer 9s linear infinite}.glitch-a{animation:glitch-a 7s steps(1,end) infinite}.glitch-b{animation:glitch-b 11s steps(1,end) infinite}
  .scan{animation:scan 8s linear infinite}.ring{transform-origin:820px 158px;animation:spin 18s linear infinite}.ring-back{animation-direction:reverse;animation-duration:27s}
  .drift-a{animation:drift-a 8s ease-in-out infinite}.drift-b{animation:drift-b 10s ease-in-out infinite}.packet{stroke-dasharray:16 440;animation:packet 9s linear infinite}
  @keyframes type{0%,8%{transform:scaleX(0)}25%,96%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  @keyframes type-cursor{0%,8%{transform:translateX(0)}25%,96%{transform:translateX(112px)}100%{transform:translateX(0)}}
  @keyframes answer{0%,25%{opacity:0}29%,96%{opacity:1}100%{opacity:0}}
  @keyframes blink{50%{opacity:0}}@keyframes scan{from{transform:translateY(-70px)}to{transform:translateY(370px)}}@keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glitch-a{0%,42%,45%,100%{transform:translate(0);opacity:0}43%{transform:translate(7px,-2px);opacity:.9}44%{transform:translate(-4px,2px);opacity:.45}}
  @keyframes glitch-b{0%,68%,71%,100%{transform:translate(0);opacity:0}69%{transform:translate(-8px,1px);opacity:.75}70%{transform:translate(5px,-1px);opacity:.35}}
  @keyframes drift-a{50%{transform:translate(8px,-7px) rotate(2deg)}}@keyframes drift-b{50%{transform:translate(-6px,9px) rotate(-2deg)}}@keyframes packet{to{stroke-dashoffset:-912}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.glitch-a,.glitch-b,.scan{display:none}.type-cursor{transform:translateX(112px)}}
</style>
<g clip-path="url(#frame)">
  <rect width="1000" height="300" fill="#070c0f"/>
  <rect x="640" width="360" height="300" fill="url(#microgrid)"/>
  <path d="M615-20 792 0 615 320 518 320Z" fill="#00e5ff" opacity=".025"/>
  <path d="M887-35 1036 89 894 332 765 270Z" fill="#ff3b9d" opacity=".035"/>
  <path d="M0 0H1000" stroke="url(#edge)" stroke-width="3"/>
  <path d="M0 94h487l20 20h108" fill="none" stroke="#315849" stroke-width="1"/>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
    <text x="33" y="68" font-size="18" fill="#65ffaf">λ</text>
    <text x="61" y="68" font-size="17" fill="#8fbca4">guest@void</text>
    <text x="156" y="68" font-size="17" fill="#4d7663">:</text>
    <g clip-path="url(#typed)"><text x="177" y="70" font-size="25" fill="#e3fff0">whoami</text></g>
    <g class="type-cursor"><path class="blink" d="M181 49v25" stroke="#69ffb3" stroke-width="8"/></g>
    <g class="answer">
      <text x="34" y="170" font-size="70" font-weight="700" letter-spacing="-5" fill="url(#name)">Der_Orange</text>
      <g clip-path="url(#name-slice)"><text class="glitch-a" x="34" y="170" font-size="70" font-weight="700" letter-spacing="-5" fill="#ff4ba1">Der_Orange</text></g>
      <text class="glitch-b" x="40" y="173" font-size="70" font-weight="700" letter-spacing="-5" fill="none" stroke="#35dce8" stroke-width="1">Der_Orange</text>
    </g>
    <g font-size="11" fill="#4e7866" letter-spacing="2">
      <text x="37" y="222">0x4D / 0110 / ∅</text><text x="37" y="244">/// 001101</text>
      <text x="620" y="45">[ X:37.2 / Y:∞ ]</text><text x="744" y="282">∴ 0x00 / ∆</text>
    </g>
  </g>
  <g class="drift-a" fill="none" stroke="#39dce8" stroke-opacity=".52">
    <path d="M567 46h39v39h-39z"/><path d="M579 34v63M555 58h63"/><circle cx="587" cy="66" r="27" stroke-dasharray="2 8"/>
  </g>
  <g class="drift-b" fill="none" stroke="#ff4aa2" stroke-opacity=".42">
    <path d="m540 245 37-64 37 64Z"/><path d="M559 214h36"/>
  </g>
  <g fill="none" transform="rotate(-13 820 158)">
    <ellipse class="ring" cx="820" cy="158" rx="128" ry="61" stroke="#51ffad" stroke-opacity=".42" stroke-dasharray="96 27 4 33"/>
    <ellipse class="ring ring-back" cx="820" cy="158" rx="91" ry="113" stroke="#2edce8" stroke-opacity=".32" stroke-dasharray="43 18 3 26"/>
    <path d="M694 158h252M820 45v226" stroke="#315c4b" stroke-opacity=".55"/>
    <path class="packet" d="M694 158h252M820 45v226" stroke="#64ffb2"/>
  </g>
  <g fill="#07100c" stroke="#5dffae"><circle cx="702" cy="184" r="5"/><circle cx="906" cy="91" r="4"/><path d="M814 151h14v14h-14z"/></g>
  <g fill="#5effae" opacity=".55">
    <path d="M646 86h34v3h-34zM657 96h12v3h-12zM940 217h31v3h-31zM928 228h12v3h-12z"/>
    <path d="M467 260h54v2h-54zM532 260h8v2h-8z" fill="#ff4aa2"/>
  </g>
  <rect class="scan" width="1000" height="58" fill="url(#sweep)"/>
  <rect width="1000" height="300" fill="url(#scanlines)"/>
</g>
<path d="M18 1H973L999 27V279L979 299H1V18Z" fill="none" stroke="#294e40"/>
<path d="M1 78V18L18 1h126M888 299h91l20-20v-57" fill="none" stroke="#62ffaf" stroke-width="2"/>
</svg>
