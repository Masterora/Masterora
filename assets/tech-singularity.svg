<style>
  .wire{fill:none;stroke:#b9b5ad;stroke-width:1;stroke-opacity:.2}.pulse{fill:none;stroke:url(#fade);stroke-width:1.6;stroke-dasharray:2 18 34 21;animation:flow 7s linear infinite}.p2{animation-duration:11s;animation-direction:reverse}.glyph{color:#d8d4cc;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;opacity:.62}.glyph use{transform-box:fill-box;transform-origin:center;animation:wake 8s steps(1,end) infinite}.g2 use{animation-delay:-2s}.g3 use{animation-delay:-4s}.g4 use{animation-delay:-6s}.iris{transform-origin:500px 170px;animation:breathe 3.8s ease-in-out infinite}.shard{animation:shiver 6s steps(1,end) infinite}.scanbar{animation:scanbar 6s linear infinite}.noise{animation:noise 5s steps(1,end) infinite}
  @keyframes flow{to{stroke-dashoffset:-150}}@keyframes breathe{50%{transform:scale(1.12);opacity:.74}}@keyframes wake{0%,8%,100%{opacity:.48}4%{opacity:1;filter:url(#glow)}}
  @keyframes shiver{0%,91%,100%{transform:translate(0)}92%{transform:translate(11px,-2px)}94%{transform:translate(-7px,3px)}96%{transform:translate(3px,-1px)}}
  @keyframes scanbar{from{transform:translateX(-220px)}to{transform:translateX(1220px)}}@keyframes noise{0%,88%,100%{opacity:0}89%,92%{opacity:.65}90%{opacity:.12}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.scanbar,.noise{display:none}}
</style>
