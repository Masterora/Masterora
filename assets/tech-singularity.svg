<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Technology singularity</title>
<desc id="desc">Eighteen technology icons orbit an animated orange energy core with neon trails, particles and glitch fragments.</desc>
<defs>
  <radialGradient id="void"><stop stop-color="#10221b"/><stop offset=".46" stop-color="#07100d"/><stop offset="1" stop-color="#05090b" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop stop-color="#fff0c2"/><stop offset=".18" stop-color="#ffbd65"/><stop offset=".58" stop-color="#ff7a3c"/><stop offset="1" stop-color="#ff3d88" stop-opacity=".08"/></radialGradient>
  <linearGradient id="edge"><stop stop-color="#62ffb0"/><stop offset=".48" stop-color="#2ddde9"/><stop offset=".8" stop-color="#ff4a9e"/><stop offset="1" stop-color="#ff9a4f"/></linearGradient>
  <linearGradient id="beam"><stop stop-color="#62ffb0" stop-opacity="0"/><stop offset=".5" stop-color="#62ffb0" stop-opacity=".22"/><stop offset="1" stop-color="#2ddde9" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .outer{transform-origin:500px 190px;animation:spin 31s linear infinite}.middle{transform-origin:500px 190px;animation:spin 19s linear infinite reverse}.inner{transform-origin:500px 190px;animation:spin 12s linear infinite}
  .core{transform-origin:500px 190px;animation:core 2.8s ease-in-out infinite}.halo{transform-origin:500px 190px;animation:halo 4.2s ease-in-out infinite}
  .packet{stroke-dasharray:5 34;animation:packet 5s linear infinite}.packet-b{animation-direction:reverse;animation-duration:8s}.sweep{animation:sweep 7s linear infinite}
  .spark{animation:spark 3s ease-in-out infinite}.spark-b{animation-delay:-1s}.spark-c{animation-delay:-2s}.glitch{animation:glitch 6s steps(1,end) infinite}.node{animation:node 3.6s ease-in-out infinite}.node-b{animation-delay:-1.2s}.node-c{animation-delay:-2.4s}
  @keyframes spin{to{transform:rotate(360deg)}}@keyframes core{50%{transform:scale(1.16);filter:url(#glow)}}@keyframes halo{50%{transform:scale(.82);opacity:.25}}
  @keyframes packet{to{stroke-dashoffset:-156}}@keyframes sweep{from{transform:translateX(-280px)}to{transform:translateX(1280px)}}
  @keyframes spark{50%{opacity:.12;transform:scale(.45)}}@keyframes node{50%{opacity:.6}}@keyframes glitch{0%,46%,49%,100%{opacity:0;transform:translate(0)}47%{opacity:.8;transform:translate(16px,-5px)}48%{opacity:.35;transform:translate(-9px,4px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.glitch,.sweep{display:none}}
</style>

<path d="M37 190 143 51 363 14 500 34 637 14 857 51 963 190 857 329 637 366 500 346 363 366 143 329Z" fill="url(#void)"/>
<path d="M37 190 143 51 363 14M637 14 857 51 963 190M963 190 857 329 637 366M363 366 143 329 37 190" fill="none" stroke="url(#edge)" stroke-opacity=".42"/>
<path class="sweep" d="M0 20 210 190 0 360Z" fill="url(#beam)" opacity=".45"/>

<g fill="none" stroke-width="1.4">
  <ellipse cx="500" cy="190" rx="182" ry="154" stroke="#55ffae" stroke-opacity=".25" stroke-dasharray="3 12"/>
  <ellipse cx="500" cy="190" rx="132" ry="112" stroke="#2ddde9" stroke-opacity=".3" stroke-dasharray="32 13 2 16"/>
  <ellipse cx="500" cy="190" rx="84" ry="72" stroke="#ff4a9e" stroke-opacity=".3" stroke-dasharray="9 14"/>
  <ellipse class="packet" cx="500" cy="190" rx="182" ry="154" stroke="#62ffb0"/>
  <ellipse class="packet packet-b" cx="500" cy="190" rx="132" ry="112" stroke="#2ddde9"/>
</g>

<g class="outer" fill="#07100d" stroke="#61ffb0" stroke-width="1.6">
  <g class="node" transform="translate(680 190)"><circle r="20"/><path d="M-12 2h19v-5H2v-5h-5v5h-5v-5h-5v5h-5v5h-4v4h4c2 7 8 10 15 9 7-1 11-5 14-11H7" stroke="#2ddde9"/></g>
  <g class="node node-b" transform="translate(590 34)"><circle r="20"/><circle r="12"/><path d="M0-15v7M0 8v7M-15 0h7M8 0h7M-10-10l5 5M5 5l5 5M10-10l-5 5M-5 5l-5 5" stroke="#2ddde9"/></g>
  <g class="node node-c" transform="translate(410 34)"><circle r="20"/><path d="M0-14c8 8 12 14 12 21A12 12 0 0 1-12 7C-12 0-8-6 0-14Z" stroke="#ff9a4f"/><path d="M-8 8h16" stroke="#ff9a4f"/></g>
  <g class="node" transform="translate(320 190)"><circle r="20"/><path d="M-13 6c5-16 21-16 26-5M-8 10c4-10 14-10 18-5M-3 13c2-5 7-5 9-2" stroke="#ff4a9e"/></g>
  <g class="node node-b" transform="translate(410 346)"><circle r="20"/><path d="M0-14 13-7v14L0 14-13 7V-7Z" stroke="#2ddde9"/><path d="M-13-7 0 0l13-7M0 0v14" stroke="#2ddde9"/></g>
  <g class="node node-c" transform="translate(590 346)"><circle r="20"/><path d="M-13 0h26M0-13v26M-9-9 9 9M9-9-9 9" stroke="#61ffb0"/><circle r="7" stroke="#2ddde9"/></g>
</g>

<g class="middle" fill="#07100d" stroke="#2ddde9" stroke-width="1.6">
  <g class="node node-b" transform="translate(630 190)"><circle r="18"/><ellipse cy="-7" rx="10" ry="4"/><path d="M-10-7V8c0 3 5 5 10 5s10-2 10-5V-7M-10 0c0 3 5 5 10 5s10-2 10-5"/></g>
  <g class="node node-c" transform="translate(565 77)"><circle r="18"/><path d="m0-11 12 6L0 1-12-5ZM0 1l12 6-12 6-12-6Z" stroke="#ff4a9e"/></g>
  <g class="node" transform="translate(435 77)"><circle r="18"/><path d="M-11 7 0-11 11 7ZM0-5v16M-6 2h12" stroke="#61ffb0"/></g>
  <g class="node node-b" transform="translate(370 190)"><circle r="18"/><path d="M-12-7h8l5 7 5-7h7M-12 7h8l5-7 5 7h7" stroke="#61ffb0"/></g>
  <g class="node node-c" transform="translate(435 303)"><circle r="18"/><path d="M-12 8c7-16 17-16 24 0M-10 0c6-8 14-8 20 0M-6-7c4-3 8-3 12 0" stroke="#ff9a4f"/></g>
  <g class="node" transform="translate(565 303)"><circle r="18"/><circle cx="-8" r="4"/><circle cx="8" cy="-7" r="4"/><circle cx="8" cy="8" r="4"/><path d="M-4-1 4-6M-4 2l8 5"/></g>
</g>

<g class="inner" fill="#07100d" stroke="#ff4a9e" stroke-width="1.5">
  <g class="node node-c" transform="translate(582 190)" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle"><circle r="16"/><text y="4" fill="#61ffb0" stroke="none">GO</text></g>
  <g class="node" transform="translate(541 119)"><circle r="16"/><path d="M-9-1c0-7 4-9 9-9h7v7H0c-2 0-3 1-3 3v2h-6Zm18 2c0 7-4 9-9 9h-7V3h7c2 0 3-1 3-3v-2h6Z" stroke="#2ddde9"/></g>
  <g class="node node-b" transform="translate(459 119)" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle"><circle r="16"/><rect x="-9" y="-9" width="18" height="18" fill="#2ddde9" stroke="none"/><text y="3" fill="#07100d" stroke="none">TS</text></g>
  <g class="node node-c" transform="translate(418 190)"><circle r="16"/><ellipse rx="11" ry="4" stroke="#2ddde9"/><ellipse rx="11" ry="4" transform="rotate(60)" stroke="#2ddde9"/><ellipse rx="11" ry="4" transform="rotate(120)" stroke="#2ddde9"/><circle r="2" fill="#2ddde9"/></g>
  <g class="node" transform="translate(459 261)"><circle r="16"/><path d="m-2-12-8 13h8l-4 11L9-4H1Z" fill="#61ffb0" stroke="none"/></g>
  <g class="node node-b" transform="translate(541 261)"><circle r="16"/><circle cx="-8" r="3"/><circle cx="7" cy="-7" r="3"/><circle cx="7" cy="8" r="3"/><path d="M-5-1 4-6M-5 2l9 5" stroke="#2ddde9"/></g>
</g>

<g class="halo" fill="none" stroke="url(#edge)"><circle cx="500" cy="190" r="61"/><circle cx="500" cy="190" r="48" stroke-dasharray="2 9"/></g>
<circle class="core" cx="500" cy="190" r="31" fill="url(#core)" filter="url(#glow)"/>
<path class="core" d="m500 168 19 11v22l-19 11-19-11v-22Z" fill="#08100d" stroke="#fff0c2"/>
<circle cx="500" cy="190" r="5" fill="#fff0c2"/>

<g fill="#62ffb0" filter="url(#glow)"><circle class="spark" cx="223" cy="95" r="3"/><circle class="spark spark-b" cx="775" cy="278" r="4"/><circle class="spark spark-c" cx="855" cy="133" r="2"/><circle class="spark" cx="155" cy="267" r="2"/><circle class="spark spark-b" cx="747" cy="61" r="3"/></g>
<g class="glitch" fill="#ff4a9e"><path d="M195 167h91v4h-91zM713 211h116v5H713zM332 289h76v3h-76z"/></g>
</svg>
