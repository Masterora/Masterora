<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Technology anomaly</title>
<desc id="desc">Eighteen technology glyphs are pulled through a monochrome data field into an animated orange anomaly.</desc>
<defs>
