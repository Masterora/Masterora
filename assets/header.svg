<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Der Orange — Systems thinker. Product builder.</title>
<desc id="desc">Animated orange and cyan orbital rings, drifting stars, a moving grid and luminous typography.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070c18"/><stop offset="1" stop-color="#172033"/></linearGradient>
 <linearGradient id="ink"><stop stop-color="#ff9b46"/><stop offset=".45" stop-color="#ffe0b0"/><stop offset="1" stop-color="#6ee7eb"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#f98532" stop-opacity=".26"/><stop offset="1" stop-color="#f98532" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6097b6" stroke-opacity=".12"/></pattern>
 <clipPath id="edge"><rect width="1200" height="380" rx="22"/></clipPath>
</defs>
<style>
 .orbit{transform-origin:960px 190px;animation:spin 18s linear infinite}.reverse{animation:spin 26s linear infinite reverse}.fast{animation:spin 9s linear infinite}
 .float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.stars{animation:twinkle 4s ease-in-out infinite alternate}.grid{animation:drift 8s linear infinite}.shine{animation:shine 6s ease-in-out infinite}.cursor{animation:blink 1.1s steps(2,end) infinite}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.4}}@keyframes twinkle{to{opacity:.25}}@keyframes drift{to{transform:translate(40px,40px)}}@keyframes shine{0%,100%{opacity:.5}50%{opacity:1}}@keyframes blink{50%{opacity:0}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#edge)">
 <rect width="1200" height="380" fill="url(#bg)"/>
 <rect class="grid" x="-40" y="-40" width="1280" height="460" fill="url(#grid)"/>
 <circle cx="960" cy="190" r="260" fill="url(#halo)"/>
 <path d="M0 379H1200" stroke="url(#ink)" stroke-width="3" class="shine"/>
 <g fill="#90e6ec" class="stars"><circle cx="720" cy="45" r="2"/><circle cx="820" cy="310" r="2"/><circle cx="1120" cy="55" r="3"/><circle cx="650" cy="285" r="2"/><circle cx="1140" cy="310" r="2"/><circle cx="760" cy="165" r="2"/></g>
 <g fill="none" stroke-width="1.5">
  <circle cx="960" cy="190" r="143" stroke="#5cbfc9" stroke-opacity=".2"/>
  <circle class="orbit" cx="960" cy="190" r="143" stroke="#64dee7" stroke-dasharray="100 55 8 80 180 475"/>
  <circle class="orbit reverse" cx="960" cy="190" r="118" stroke="#ff9c4a" stroke-dasharray="160 50 5 50 80 400"/>
  <circle class="orbit fast" cx="960" cy="190" r="92" stroke="#ffd2a0" stroke-dasharray="4 16" stroke-opacity=".5"/>
 </g>
 <g class="orbit"><circle cx="960" cy="47" r="5" fill="#70e9f2"/><circle cx="960" cy="47" r="11" fill="#70e9f2" opacity=".13"/></g>
 <g class="orbit reverse"><circle cx="960" cy="308" r="5" fill="#ffad65"/></g>
 <g class="float"><circle cx="960" cy="190" r="66" fill="#ff963d"/><circle cx="981" cy="169" r="17" fill="#ffd29a" opacity=".8"/><path d="M955 116c4-24 24-35 48-28-10 20-24 29-48 28Z" fill="#91ddb2"/><text x="960" y="205" text-anchor="middle" font-family="monospace" font-size="40" font-weight="bold" fill="#482710">&lt;/&gt;</text></g>
 <g font-family="Arial,Helvetica,sans-serif">
  <circle class="pulse" cx="60" cy="61" r="5" fill="#75e6bc"/>
  <text x="77" y="66" font-family="monospace" font-size="14" letter-spacing="3" fill="#a9c2cc">MASTERORA / ENGINEER &amp; BUILDER</text>
  <text x="54" y="158" font-size="76" font-weight="800" fill="url(#ink)">Der Orange.</text>
  <text x="58" y="211" font-size="25" fill="#dde6ef">Systems thinker. Product builder.</text>
  <text x="58" y="260" font-family="monospace" font-size="17" fill="#84dce5">&gt; turn complexity into clarity</text><path class="cursor" d="M402 245v19" stroke="#ffb36c" stroke-width="9"/>
  <g font-family="monospace" font-size="13" letter-spacing="2" text-anchor="middle">
   <rect x="58" y="301" width="132" height="31" rx="15" fill="#ff9b46" fill-opacity=".1" stroke="#ff9b46" stroke-opacity=".5"/><text x="124" y="322" fill="#ffbd85">BACKEND</text>
   <rect x="202" y="301" width="110" height="31" rx="15" fill="#64dee7" fill-opacity=".08" stroke="#64dee7" stroke-opacity=".4"/><text x="257" y="322" fill="#8ee8ec">AI</text>
   <rect x="324" y="301" width="132" height="31" rx="15" fill="#c3b5fd" fill-opacity=".08" stroke="#c3b5fd" stroke-opacity=".4"/><text x="390" y="322" fill="#d0c4ff">PRODUCT</text>
  </g>
 </g>
</g>
</svg>
