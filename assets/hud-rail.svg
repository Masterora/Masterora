<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="presentation">
<defs>
  <linearGradient id="rail"><stop stop-color="#61ffb0" stop-opacity="0"/><stop offset=".18" stop-color="#61ffb0"/><stop offset=".74" stop-color="#2eddea"/><stop offset="1" stop-color="#ff4a9f" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-40%" y="-200%" width="180%" height="500%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .pulse-a{animation:pulse-a 5s linear infinite}.pulse-b{animation:pulse-b 7s linear infinite}.pulse-c{animation:pulse-c 9s linear infinite}
  .bars path{animation:bars 2.8s steps(4,end) infinite}.bars path:nth-child(2){animation-delay:-.7s}.bars path:nth-child(3){animation-delay:-1.4s}
  @keyframes pulse-a{from{transform:translateX(-80px)}to{transform:translateX(1080px)}}
  @keyframes pulse-b{from{transform:translateX(1050px)}to{transform:translateX(-1050px)}}
  @keyframes pulse-c{0%,100%{opacity:.12}50%{opacity:.8}}
  @keyframes bars{50%{opacity:.18}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
