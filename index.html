<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Der_Orange / Pinball</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#ccc;font-family:monospace}
main{min-height:100svh;display:grid;place-items:center;padding:24px}
#field{position:relative;width:min(1500px,100%);aspect-ratio:1983/793;outline:none;touch-action:pan-y}
#field:focus-visible{outline:1px solid #8aff00;outline-offset:12px}
img,svg{display:block;width:100%;height:100%;object-fit:contain}
nav{position:fixed;bottom:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em}
a,button{color:#999;background:none;border:0;font:inherit;text-decoration:none;padding:12px;cursor:pointer}
a:hover,button:hover{color:#8aff00}a:focus-visible,button:focus-visible{outline:1px solid #8aff00}
@media(max-width:600px){main{padding:12px}nav{left:8px;right:8px;bottom:12px}}
</style>
</head>
<body>
<main><div id="field" tabindex="0" role="button" aria-label="Activate the pinball flippers. Click, tap, or press Enter.">
<img src="./assets/tech-pinball-v1.svg" alt="Technology pinball with green balls, bumpers and pixel sparks">
</div></main>
<nav><a href="https://github.com/Masterora" aria-label="Back to GitHub">↖ GITHUB</a><button id="motion" type="button" aria-pressed="false">PAUSE</button></nav>
<script>
const field=document.querySelector('#field'),motion=document.querySelector('#motion');
const preference=matchMedia('(prefers-reduced-motion: reduce)');
let paused=preference.matches,resetTimer;
function sync(){
  field.classList.toggle('paused',paused);
  if(paused){clearTimeout(resetTimer);field.classList.remove('launch')}
  motion.textContent=paused?'PLAY':'PAUSE';
  motion.setAttribute('aria-pressed',String(paused));
}
fetch('./assets/tech-pinball-v1.svg').then(r=>{if(!r.ok)throw Error('Artwork unavailable');return r.text()}).then(markup=>{
  field.innerHTML=markup;sync();
}).catch(()=>{motion.hidden=true});
function flip(){
  if(paused||preference.matches)return;
  field.classList.add('launch');
  clearTimeout(resetTimer);resetTimer=setTimeout(()=>field.classList.remove('launch'),220);
}
field.addEventListener('pointerdown',flip);
field.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();flip()}});
motion.addEventListener('click',()=>{paused=!paused;sync()});
preference.addEventListener('change',e=>{paused=e.matches;sync()});
sync();
</script>
</body>
</html>
