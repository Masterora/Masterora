<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#060806" media="(prefers-color-scheme: dark)">
<title>Der_Orange / Pinball</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060806;color:#d9dfd4;font:12px ui-monospace,SFMono-Regular,monospace;min-height:100svh}main{min-height:100svh;display:flex;flex-direction:column;justify-content:center;width:min(1560px,100%);padding:32px;margin:auto;gap:20px}header,footer,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{letter-spacing:.2em;color:#a9bc9d}.brand b{color:#b3ff5a;font-weight:400}.telemetry{font-variant-numeric:tabular-nums;color:#84947b}.telemetry output{color:#d6efc0;font-size:18px;margin-left:12px}#field{position:relative;aspect-ratio:1983/793;width:100%;border:1px solid #2b3526;border-radius:16px;background:#030503;box-shadow:0 30px 100px #0009;overflow:hidden;touch-action:none}#field:focus-visible{outline:2px solid #b3ff5a;outline-offset:5px}img,svg{display:block;width:100%;height:100%}.live .moving-ball,.live .replay-score,.live .replay-burst{display:none}.live .bumper,.live .impact,.live .sling-effect,.live .flipper-left,.live .flipper-right,.live .kicker{animation:none!important}.live .impact{opacity:0}.live .flipper-left,.live .flipper-right{visibility:hidden}.paused *{animation-play-state:paused!important}button,a{font:inherit;letter-spacing:.04em;color:#abb7a3;text-decoration:none;background:#0c100b;border:1px solid #2a3525;border-radius:7px;min-height:44px;padding:12px 16px;cursor:pointer}button:hover,a:hover{border-color:#718e52;color:#cfff91}button:focus-visible,a:focus-visible{outline:2px solid #b3ff5a;outline-offset:3px}button[aria-pressed=true]{color:#b3ff5a;border-color:#658840}button:disabled{opacity:.4;cursor:default}.hint{color:#8b9982}.paddles{display:flex;gap:8px}.paddles button{min-width:86px;touch-action:none;user-select:none}.paddles button:active{background:#9fe83e;color:#142008}footer{flex-wrap:wrap}.error{color:#f0be8b}@media(max-width:650px){main{padding:12px;gap:14px}.brand{font-size:10px}.hint{width:100%;order:3;text-align:center;font-size:11px}.controls{gap:6px}button,a{padding:10px}.telemetry output{font-size:15px}.paddles button{min-width:68px}#field{border-radius:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.scoreboard{display:flex;gap:26px;align-items:center;font-variant-numeric:tabular-nums}.scoreboard>div{display:flex;flex-direction:column;gap:5px;min-width:60px;position:relative}.scoreboard span{font-size:9px;letter-spacing:.16em;color:#92a486}.scoreboard output{font-size:22px;color:#d7e9c7;line-height:1}.scoreboard .score-main output{font-size:34px;letter-spacing:.08em;color:#bbff68;text-shadow:0 0 18px #8dff2428;transform-origin:right center}.combo-track{height:2px;width:60px;background:#26331c;position:absolute;bottom:-7px}.combo-track i{display:block;height:100%;background:#b5ff64;transform-origin:left;transform:scaleX(0)}@media(max-width:800px){header{align-items:flex-start;flex-direction:column;gap:20px}.scoreboard{width:100%;justify-content:space-between;gap:12px}.scoreboard .score-main output{font-size:28px}.scoreboard output{font-size:20px}}@media(max-width:380px){.hit-cell{display:none!important}}
@media(prefers-color-scheme:light){
body{background:#fff;color:#202820}#field{background:#fff;border-color:#d7dfd2;box-shadow:0 20px 60px #263d1810}#field>svg,#field>img{filter:invert(1) hue-rotate(180deg)}
.brand,.hint,.scoreboard span{color:#586451}.brand b{color:#346714}.scoreboard output{color:#293c22}.scoreboard .score-main output{color:#316a12;text-shadow:none}.combo-track{background:#e0e8da}.combo-track i{background:#437e21}
button,a{background:#f7f9f5;border-color:#d4decf;color:#405137}button:hover,a:hover{border-color:#6d8c5a;color:#234917}button[aria-pressed=true]{color:#326413;border-color:#709253}.paddles button:active{background:#daf0c6;color:#21420f}button:focus-visible,a:focus-visible,#field:focus-visible{outline-color:#437e21}.error{color:#995000}
}
</style>
</head>
<body><main>
<header><span class="brand"><b>●</b> TECH / PINBALL</span><div class="scoreboard" aria-label="记分板"><div class="score-main"><span>SCORE</span><output id="score">00000000</output></div><div><span>COMBO</span><output id="combo">0</output><i class="combo-track"><i id="combo-life"></i></i></div><div><span>MULTI</span><output id="multiplier">×1</output></div><div class="hit-cell"><span>HITS</span><output id="hits">00000</output></div></div></header>
<div id="field" tabindex="0" role="group" aria-label="弹珠台。左右方向键控制挡板，空格发球。"><img src="./assets/tech-pinball-v4.svg" alt="技术图标弹珠台"></div>
<footer><div class="controls"><a href="https://github.com/Masterora" aria-label="返回 GitHub">↖ GITHUB</a><button id="motion" aria-pressed="false" disabled>暂停</button><button id="launch" disabled>发球</button></div><span class="hint" id="status">自动演示 · ← → 挡板 / 空格发球</span><div class="paddles"><button id="left" aria-label="左挡板" disabled>←</button><button id="right" aria-label="右挡板" disabled>→</button></div></footer>
</main><script type="module" src="./pinball.mjs?v=score-1"></script></body></html>
