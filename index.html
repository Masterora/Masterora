<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f5f4ed" media="(prefers-color-scheme:light)"><meta name="theme-color" content="#10130f" media="(prefers-color-scheme:dark)"><title>Masterora / Pinball</title><link rel="stylesheet" href="./arcade.css?v=6"></head>
<body><main class="machine">
<header class="masthead"><div><p class="eyebrow">MASTERORA <span>/</span> ARCADE 01</p><h1>TECH<span>PINBALL</span><i aria-hidden="true">↗</i></h1></div><div class="header-actions"><span class="indicator" id="status" role="status">自动演示</span><a href="https://github.com/Masterora" class="github" aria-label="返回 GitHub">GITHUB <span>↗</span></a></div></header>
<section class="cabinet" aria-label="技术弹珠街机"><div class="stage-top"><span><i aria-hidden="true"></i> PLAYFIELD</span><span>19 TARGETS <b>/</b> 03 BALLS</span></div><div id="field" tabindex="0" role="group" aria-label="弹珠台。左右方向键控制挡板，空格发球。"><img src="./assets/arcade-replay.svg" alt="彩色技术图标弹珠台"></div>
<div class="console"><div class="score-unit"><span class="label">TOTAL SCORE</span><output id="score">00000000</output><div class="score-meta"><span>HITS <b id="hits">00000</b></span><span>BEST <b id="best">00000000</b></span></div></div><div class="chain-unit"><div class="chain-head"><span class="label">CHAIN</span><output id="multiplier">×1</output></div><output id="combo">00</output><i class="combo-track"><i id="combo-life"></i></i></div><div class="input-unit"><span class="label">FLIPPERS <span class="input-hint">← → / A D</span></span><div class="paddles"><button id="left" aria-label="左挡板" disabled><span>↖</span><small>LEFT</small></button><button id="right" aria-label="右挡板" disabled><span>↗</span><small>RIGHT</small></button></div></div><div class="system-unit"><button id="launch" class="launch" disabled>发球 <span>↗</span></button><div class="secondary"><button id="motion" aria-pressed="false" disabled>暂停</button><button id="reset" disabled>重开</button></div></div></div></section>
<footer><span>← → 挡板 <b>·</b> SPACE 发球</span><span>100 / TARGET <b>·</b> 250 / SLING <b>·</b> MAX ×8</span><span class="footer-id">MASTERORA / 01</span></footer>
</main><script type="module" src="./pinball.mjs?v=machine-6"></script></body></html>
